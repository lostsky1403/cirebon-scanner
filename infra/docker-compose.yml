services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cpj}
      POSTGRES_USER: ${POSTGRES_USER:-cpj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpj} -d ${POSTGRES_DB:-cpj}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cpj}:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/${POSTGRES_DB:-cpj}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-cpj.supertix.co.id}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
